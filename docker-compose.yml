# Build this checkout with its Dockerfile (the one the published images use)
# and run the web UI on http://localhost:7860:
#
#   docker compose up --build

services:
  pdf2zh:
    build: .
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["pdf2zh", "-i"]

    # Optional: Mount a volume for persistent data I/O if needed
    # volumes:
    #   - ./data:/app/data

    stdin_open: true
    tty: true
