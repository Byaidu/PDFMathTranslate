[project]
name = "pdf2zh"
version = "1.9.12"
description = "Latex PDF Translator"
authors = [{ name = "Byaidu", email = "byaidux@gmail.com" }]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"  # babeldoc supports <3.14
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Core: CLI, Python API, MCP entry points, translation services and the
# default BabelDOC kernel. The legacy kernel, GUI and HTTP backend are extras.
dependencies = [
    "requests",
    "googletrans>=4.0.2,<5",
    # babeldoc 0.6 requires >=1.26.7; 1.26.7 ships linux aarch64 wheels
    "pymupdf>=1.26.7",
    "tqdm",
    "tenacity",
    "numpy",
    "ollama",
    "xinference-client",
    "deepl",
    "openai>=1.0.0",
    # 2.0 switches to the 2026-06-06 service API, untested with the China endpoint
    "azure-ai-translation-text>=1.0.0,<2",
    # 3.1.129 removed the TextTranslate API
    "tencentcloud-sdk-python-tmt>=3.1.50,<=3.1.121",
    "peewee>=3.17.8",
    "babeldoc>=0.6.4,<0.7.0",
    # bitstring 5.0 removed BitStream, which babeldoc 0.6.4 imports
    "bitstring<5",
    "rich",
]

[project.optional-dependencies]
legacy = [
    "huggingface_hub",
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    "pdfminer-six>=20250416",
    "pikepdf",
    "fontTools",
]
ultrafast = ["pdf2zh[legacy]", "pdf-inspector>=1.25.2,<2"]
ocr = [
    "pdf2zh[legacy]",
    "pooch>=1.8,<2",  # first-use downloads for PyMuPDF's built-in OCR
]
gui = [
    "pdf2zh[legacy]",
    # >=6.16.0 fixes the gradio 5.x advisories (e.g. CVE-2026-28414)
    "gradio>=6.16.0,<7",
    "gradio_pdf>=0.0.24",  # first release supporting gradio 6
]
backend = [
    "pdf2zh[legacy]",
    "flask",
    "celery",
    "redis"
]
argostranslate = [
    "argostranslate"
]
mcp = [
    "mcp>=1.26.0",  # resource meta for MCP Apps; older fail with pydantic 2.14
]
cuda = [
    "onnxruntime-gpu",
]
dml = [
    "onnxruntime-directml",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "build",
    "bumpver>=2024.1130",
]

[project.urls]
Homepage = "https://github.com/Byaidu/PDFMathTranslate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pdf2zh = "pdf2zh.pdf2zh:main"

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.9.12"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"pdf2zh/__init__.py" = [
    '__version__ = "{version}"'
]
