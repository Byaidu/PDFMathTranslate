# dsh-pdf2zh: a PDF reader that translates as you scroll, and the
# pdf2zh_translate tool.
#
# Defaults suit most setups. To change them, override this row in your
# profile's cordis.patch.yml (a later layer replaces the whole config):
#
#   - id: tool-pdf2zh
#     config:
#       command: /Users/me/.local/bin/pdf2zh   # or: uvx pdf2zh
#       langOut: ja
#       service: openai:gpt-4o-mini
- insert:
    - id: tool-pdf2zh
      name: dsh-pdf2zh
      config: {}
